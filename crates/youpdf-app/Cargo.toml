description = "Application desktop YouPDF (egui/eframe)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true

[[bin]]
name = "youpdf"
path = "src/main.rs"

[dependencies]
youpdf-shared = { workspace = true }
youpdf-core   = { workspace = true }
youpdf-ai     = { workspace = true }

# Fil de travail du panneau IA : un runtime tokio dédié, jamais le fil UI.
tokio = { workspace = true }

eframe              = { workspace = true }
egui                = { workspace = true }
egui-phosphor       = "0.7"
tracing             = { workspace = true }
tracing-subscriber  = { workspace = true }
chrono              = { workspace = true }
rfd                 = "0.15"

[package]
name        = "youpdf-app"
description = "Application desktop YouPDF (egui/eframe)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true

[[bin]]
name = "youpdf"
path = "src/main.rs"

[dependencies]
youpdf-shared = { workspace = true }
youpdf-core   = { workspace = true }
youpdf-ai     = { workspace = true }

# Fil de travail du panneau IA : un runtime tokio dédié, jamais le fil UI.
tokio = { workspace = true }

eframe              = { workspace = true }
egui                = { workspace = true }
egui-phosphor       = "0.7"
tracing             = { workspace = true }
tracing-subscriber  = { workspace = true }
chrono              = { workspace = true }
rfd                 = "0.15"

# Lecture de l'image du presse-papiers pour « Insérer depuis le
# presse-papiers ». `egui-winit` tire déjà `arboard` : on le déclare pour
# pouvoir s'en servir directement.
arboard = "3"

# Encodage PNG de cette image avant de la confier au moteur PDF.
image = { version = "0.25", default-features = false, features = ["png"] }

# Rastérisation du nom dans « Créer une signature ». `epaint` tire déjà
# `ab_glyph` pour ses propres polices.
ab_glyph = "0.2"

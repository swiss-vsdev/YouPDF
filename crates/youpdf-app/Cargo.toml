[package]
name        = "youpdf-app"
description = "Application desktop YouPDF (egui/eframe)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true

[[bin]]
name = "youpdf"
path = "src/main.rs"

[dependencies]
youpdf-shared = { workspace = true }
youpdf-core   = { workspace = true }
youpdf-ai     = { workspace = true }

# Fil de travail du panneau IA : un runtime tokio dédié, jamais le fil UI.
tokio = { workspace = true }

eframe              = { workspace = true }
egui                = { workspace = true }
egui-phosphor       = "0.7"
tracing             = { workspace = true }
tracing-subscriber  = { workspace = true }
chrono              = { workspace = true }
rfd                 = "0.15"

# Lecture de l'image du presse-papiers pour « Insérer depuis le
# presse-papiers ». `egui-winit` tire déjà `arboard` : on le déclare pour
# pouvoir s'en servir directement.
arboard = "3"

# Encodage PNG de cette image avant de la confier au moteur PDF.
image = { version = "0.25", default-features = false, features = ["png"] }

# Rastérisation du nom dans « Créer une signature ». `epaint` tire déjà
# `ab_glyph` pour ses propres polices.
ab_glyph = "0.2"

# Barre de menu macOS native (9 menus, comme UPDF). `eframe` tire déjà
# `objc2`/`objc2-app-kit`/`objc2-foundation` 0.5.x / 0.2.2 : on les
# réutilise pour construire un `NSMenu` réel au lieu d'un bouton `…`.
[target."cfg(target_os = \"macos\")".dependencies]
objc2          = "0.5"
objc2-app-kit  = { version = "0.2", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder", "NSEvent", "NSRunningApplication", "NSCell", "NSWindow", "NSView"] }
objc2-foundation = "0.2"

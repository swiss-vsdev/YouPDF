[package]
name        = "youpdf-core"
description = "Moteur PDF de YouPDF : parsing, rendu, annotation, OCR, conversion, protection, édition."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true

[dependencies]
youpdf-shared = { workspace = true }
lopdf         = { workspace = true }
serde         = { workspace = true }
thiserror     = { workspace = true }
uuid          = { workspace = true }
chrono        = { workspace = true }
tracing       = { workspace = true }
regex         = { workspace = true }

# `render::PageBitmap::to_egui_image` produit une `egui::ColorImage`.
egui = { workspace = true }

# Compression JPEG des pages caviardées (rasterisées) et décodage des
# images insérées dans une page. `image` est déjà tiré par `pdfium-render`
# et `eframe` : aucune dépendance nouvelle.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }

# Compression zlib des images embarquées (`/FlateDecode`). Déjà tiré par
# `lopdf` ; on le déclare pour l'utiliser directement.
flate2 = "1"

# Rendu réel via pdfium (binaire embarqué).
#
# `sync` rend `Pdfium` `Send + Sync`, ce qui permet de le garder dans un
# `static OnceLock` : pdfium ne s'initialise qu'une fois par processus. Un
# second `FPDF_InitLibrary` laisserait le mutex interne de `pdfium-render`
# verrouillé et figerait le processus. La sécurité des appels concurrents
# est assurée par notre propre verrou (`render::PDFIUM_LOCK`), pas par
# cette option.
pdfium-render = { version = "0.8", features = ["bindings", "sync"] }

# Empaquetage des parties OOXML pour l'export Word / Excel / PowerPoint.
# `deflate` suffit : les fichiers `.docx`/`.xlsx`/`.pptx` sont des ZIP
# compressés en DEFLATE.
zip = { version = "8", default-features = false, features = ["deflate"] }

# Fichiers temporaires pour l'OCR.
tempfile = "3"

# Cryptographie.
md-5      = "0.10"
sha2      = "0.10"
aes       = "0.8"
cbc       = { version = "0.1", features = ["alloc"] }
getrandom = "0.2"
rsa         = { workspace = true }
cms         = { workspace = true }
x509-cert   = { workspace = true }
der         = { workspace = true }
spki        = { workspace = true }
pkcs8       = { workspace = true }
pkcs12      = { workspace = true }
const-oid   = { workspace = true }
time        = { workspace = true }

[dev-dependencies]
# Validation du XML produit par l'export Office dans les tests.
quick-xml = "0.41"
rcgen = { workspace = true }
